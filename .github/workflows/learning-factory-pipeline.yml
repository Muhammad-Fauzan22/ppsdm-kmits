# Infinite Learning Factory - Full Autonomous Pipeline v3.0
# =========================================================
# Complete 24/7 self-healing pipeline with:
# - Scheduled runs every 6 hours
# - Manual trigger via workflow_dispatch
# - Repository dispatch for API triggers
# - Smart error recovery and notifications

name: 🏭 Autonomous Learning Factory

on:
  schedule:
    # Run every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  
  workflow_dispatch:
    inputs:
      phase:
        description: 'Pipeline phase to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - harvest
          - process
          - generate
          - export
      
      debug:
        description: 'Enable debug mode'
        required: false
        default: false
        type: boolean

  repository_dispatch:
    types: [learning-factory-trigger]

env:
  PYTHON_VERSION: '3.11'
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}

concurrency:
  group: learning-factory
  cancel-in-progress: false

jobs:
  # ========================================
  # UNIFIED PIPELINE - All Phases Sequential
  # ========================================
  pipeline:
    name: 🚀 Complete Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      
      - name: 📦 Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt
      
      - name: 🔧 Determine Phase
        id: phase
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            PHASE="${{ github.event.client_payload.phase || 'all' }}"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            PHASE="${{ github.event.inputs.phase }}"
          else
            PHASE="all"
          fi
          echo "phase=$PHASE" >> $GITHUB_OUTPUT
          echo "Running phase: $PHASE"
      
      - name: 🏭 Run Autonomous Orchestrator
        run: |
          cd scripts
          python orchestrator.py --phase ${{ steps.phase.outputs.phase }}
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
          PYTHONIOENCODING: utf-8
      
      - name: 📊 Generate Summary
        if: always()
        run: |
          echo "# 🏭 Learning Factory Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Phase:** ${{ steps.phase.outputs.phase }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Scheduled Run" >> $GITHUB_STEP_SUMMARY
          echo "The next automatic run will be in approximately 6 hours." >> $GITHUB_STEP_SUMMARY

  # ========================================
  # NOTIFICATION - On Failure Only
  # ========================================
  notify-failure:
    name: ⚠️ Failure Alert
    runs-on: ubuntu-latest
    needs: pipeline
    if: failure()
    
    steps:
      - name: Send Failure Notification
        run: |
          echo "Pipeline failed at $(date)" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs for details." >> $GITHUB_STEP_SUMMARY
          # Optional: Add Slack/email notification here
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"🚨 Learning Factory Failed!"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
