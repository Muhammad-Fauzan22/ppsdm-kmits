<svg width="400" height="600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#2d5a87;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3d7ab5;stop-opacity:1" />
        </linearGradient>
        <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.1)"/>
        </pattern>
    </defs>
    
    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#grad)"/>
    <rect width="100%" height="100%" fill="url(#dots)"/>
    
    <!-- Border -->
    <rect x="15" y="15" width="370" height="570" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    
    <!-- Logo Area -->
    <circle cx="200" cy="150" r="60" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <text x="200" y="165" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
          fill="white" text-anchor="middle">KDKM</text>
    
    <!-- Title -->
    <text x="200" y="280" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
          fill="white" text-anchor="middle">Buku 1</text>
    <text x="200" y="310" font-family="Arial, sans-serif" font-size="28" font-weight="bold" 
          fill="white" text-anchor="middle">KDKM dan HDPSDM</text>
    <text x="200" y="340" font-family="Arial, sans-serif" font-size="20" 
          fill="rgba(255,255,255,0.9)" text-anchor="middle">MUBES V ITS</text>
    
    <!-- Divider -->
    <line x1="100" y1="380" x2="300" y2="380" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    
    <!-- Author -->
    <text x="200" y="420" font-family="Arial, sans-serif" font-size="14" 
          fill="rgba(255,255,255,0.8)" text-anchor="middle">Disusun oleh</text>
    <text x="200" y="445" font-family="Arial, sans-serif" font-size="18" font-weight="bold" 
          fill="white" text-anchor="middle">PPSDM KMM ITS</text>
    
    <!-- Category Badge -->
    <rect x="130" y="480" width="140" height="30" rx="15" fill="rgba(255,255,255,0.2)"/>
    <text x="200" y="500" font-family="Arial, sans-serif" font-size="12" 
          fill="white" text-anchor="middle">PANDUAN KEORGANISASIAN</text>
    
    <!-- Footer -->
    <text x="200" y="560" font-family="Arial, sans-serif" font-size="10" 
          fill="rgba(255,255,255,0.5)" text-anchor="middle">Keluarga Mahasiswa Mesin ITS</text>
    <text x="200" y="575" font-family="Arial, sans-serif" font-size="10" 
          fill="rgba(255,255,255,0.5)" text-anchor="middle">PPSDM KMM Learning Library</text>
</svg>